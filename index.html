<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Bonificação G2L</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="theme-controls" aria-label="Controles de tema">
        <button id="btn-current" class="theme-button" title="Tema atual">Win 98</button>
        <button id="btn-xp" class="theme-button" title="Tema Matrix">Matrix</button>
        <button id="btn-matrix-toggle" class="theme-button" title="Ativar/Desativar animação Matrix">Matrix On</button>
    </div>

    <!-- Canvas usado pelo efeito Matrix; ativado via JS quando o tema é aplicado -->
    <canvas id="matrix-canvas" aria-hidden="true"></canvas>

    <div id="app"></div>
    <script src="app.js"></script>
</body>
</html>
